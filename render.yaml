
databases:
  - name: trustvault-db
    plan: basic-256mb
    databaseName: trustvault
    user: trustvault

services:
  - type: web
    name: trustvault-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: trustvault-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://trustvault-web-k6un.onrender.com
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: static
    name: trustvault-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trustvault-ci3v.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
